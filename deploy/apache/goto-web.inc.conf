# Include ONLY inside the deway.fr HTTPS VirtualHost, before the existing proxies.
RewriteEngine On
RewriteRule "^/goto$" "/goto/" [R=308,L]
RewriteRule "^/goto/(?:index\.php/)?pricing(?:/.*)?$" "-" [G,L]
# Retire direct access to the WordPress runtime as well as the former showcase.
RewriteRule "^/(?:wordpress(?:/.*)?|wp-admin(?:/.*)?|wp-login\.php|xmlrpc\.php|wp-json(?:/.*)?)$" "-" [G,L]

ProxyPass "/goto/" "http://127.0.0.1:8113/" connectiontimeout=5 timeout=60 retry=0
ProxyPassReverse "/goto/" "http://127.0.0.1:8113/"

<Location "/goto/">
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Header always set Cache-Control "no-cache"
    Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_URI} =~ m#^/goto/assets/# && (%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 206 || %{REQUEST_STATUS} == 304)"
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript image/svg+xml
</Location>
<Location "/goto/downloads/goto-android.apk">
    Header always set Content-Disposition "attachment; filename=goto-android.apk"
</Location>
<Location "/goto/downloads/goto-ios.zip">
    Header always set Content-Disposition "attachment; filename=goto-ios.zip"
</Location>

<Directory "/var/www/html/wordpress">
    AllowOverride None
    Options None
    Require all denied
</Directory>
