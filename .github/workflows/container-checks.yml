name: Container checks
on:
  pull_request:
    branches: [main]
    paths: ['api/**', 'web/**', 'scripts/**', 'deploy/**', '.github/workflows/*', '.github/dependabot.yml']
  push:
    branches: [main]
    paths: ['api/**', 'web/**', 'scripts/**', 'deploy/**', '.github/workflows/*', '.github/dependabot.yml']
permissions:
  contents: read
concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check WEB build contract
        if: matrix.component == 'web'
        run: |
          python3 -m unittest discover -s web/tests
          python3 -m unittest discover -s scripts/tests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.component }}
          load: true
          push: false
          platforms: linux/amd64
          tags: goto-${{ matrix.component }}:ci
          cache-from: type=gha,scope=goto-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=goto-${{ matrix.component }}
      - name: Exercise the image
        env:
          COMPONENT: ${{ matrix.component }}
        run: bash "scripts/smoke-${COMPONENT}.sh" "goto-${COMPONENT}:ci"
